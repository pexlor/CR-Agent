[output]
reports_dir = "reports"
state_database = "state/reviews.sqlite3"

[budget]
# Replace this example price with the configured model's actual blended price.
max_cost_per_review_cny = "10.00"
price_per_million_tokens_cny = "20.00"
max_tokens = 1000000

[provider]
id = "openai-compatible"
version = "1"
model = "your-model"
origin = "https://api.example.com"
path = "/v1/chat/completions"
api_key = "REPLACE_WITH_A_REAL_KEY"
timeout_seconds = 60
max_response_bytes = 1048576
max_output_tokens = 4096
structured_output = "json_object"

[rules]
id = "default"
version = "1"

[security]
policy_id = "code-review-agent-default"
policy_version = 1
