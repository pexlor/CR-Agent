[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "A local, traceable code review agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "detect-secrets>=1.5,<2",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "keyring>=25,<26",
  "pydantic>=2.8,<3",
  "platformdirs>=4,<5",
  "pygithub>=2.4,<3",
  "python-gitlab>=5,<6",
  "rich>=13.9,<14",
  "typer>=0.12,<1",
  "unidiff>=0.7,<1",
]

[project.scripts]
code-review-agent = "code_review_agent.cli.app:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "hypothesis>=6.112,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_agent"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
